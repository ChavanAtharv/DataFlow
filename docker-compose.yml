services:
  postgres:
    image: postgres:16-alpine
    container_name: dataflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dataflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dataflow_secret}
      POSTGRES_DB: ${DB_NAME:-dataflow}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dataflow} -d ${DB_NAME:-dataflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

